naftiko: 1.0.0-alpha2
info:
  label: Workday Integrations Workday REST API — Recruiting
  description: 'Workday Integrations Workday REST API — Recruiting. 2 operations. Lead operation: Workday Integrations List
    job requisitions. Self-contained Naftiko capability covering one Workday Integrations business surface.'
  tags:
  - Workday Integrations
  - Recruiting
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WORKDAY_INTEGRATIONS_API_KEY: WORKDAY_INTEGRATIONS_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-recruiting
    baseUri: https://wd2-impl-services1.workday.com/ccx/api/v1/{tenant}
    description: Workday Integrations Workday REST API — Recruiting business capability. Self-contained, no shared references.
    resources:
    - name: jobRequisitions
      path: /jobRequisitions
      operations:
      - name: listjobrequisitions
        method: GET
        description: Workday Integrations List job requisitions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: jobRequisitions-jobRequisitionId
      path: /jobRequisitions/{jobRequisitionId}
      operations:
      - name: getjobrequisition
        method: GET
        description: Workday Integrations Get a job requisition
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: jobRequisitionId
          in: path
          type: string
          description: Workday ID of the job requisition
          required: true
    authentication:
      type: bearer
      token: '{{env.WORKDAY_INTEGRATIONS_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-recruiting-rest
    port: 8080
    description: REST adapter for Workday Integrations Workday REST API — Recruiting. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/jobrequisitions
      name: jobrequisitions
      description: REST surface for jobRequisitions.
      operations:
      - method: GET
        name: listjobrequisitions
        description: Workday Integrations List job requisitions
        call: rest-recruiting.listjobrequisitions
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/jobrequisitions/{jobrequisitionid}
      name: jobrequisitions-jobrequisitionid
      description: REST surface for jobRequisitions-jobRequisitionId.
      operations:
      - method: GET
        name: getjobrequisition
        description: Workday Integrations Get a job requisition
        call: rest-recruiting.getjobrequisition
        with:
          jobRequisitionId: rest.jobRequisitionId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-recruiting-mcp
    port: 9090
    transport: http
    description: MCP adapter for Workday Integrations Workday REST API — Recruiting. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: workday-integrations-list-job-requisitions
      description: Workday Integrations List job requisitions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-recruiting.listjobrequisitions
      outputParameters:
      - type: object
        mapping: $.
    - name: workday-integrations-get-job-requisition
      description: Workday Integrations Get a job requisition
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-recruiting.getjobrequisition
      with:
        jobRequisitionId: tools.jobRequisitionId
      outputParameters:
      - type: object
        mapping: $.
