naftiko: 1.0.0-alpha2
info:
  label: Workday Integrations Workday Prism Analytics API — Data Sources
  description: 'Workday Integrations Workday Prism Analytics API — Data Sources. 1 operations. Lead operation: Workday Integrations
    List data sources. Self-contained Naftiko capability covering one Workday Integrations business surface.'
  tags:
  - Workday Integrations
  - Data Sources
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WORKDAY_INTEGRATIONS_API_KEY: WORKDAY_INTEGRATIONS_API_KEY
capability:
  consumes:
  - type: http
    namespace: prism-analytics-data-sources
    baseUri: https://wd2-impl-services1.workday.com/ccx/api/prismAnalytics/v2/{tenant}
    description: Workday Integrations Workday Prism Analytics API — Data Sources business capability. Self-contained, no shared
      references.
    resources:
    - name: dataSources
      path: /dataSources
      operations:
      - name: listdatasources
        method: GET
        description: Workday Integrations List data sources
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.WORKDAY_INTEGRATIONS_API_KEY}}'
  exposes:
  - type: rest
    namespace: prism-analytics-data-sources-rest
    port: 8080
    description: REST adapter for Workday Integrations Workday Prism Analytics API — Data Sources. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/datasources
      name: datasources
      description: REST surface for dataSources.
      operations:
      - method: GET
        name: listdatasources
        description: Workday Integrations List data sources
        call: prism-analytics-data-sources.listdatasources
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: prism-analytics-data-sources-mcp
    port: 9090
    transport: http
    description: MCP adapter for Workday Integrations Workday Prism Analytics API — Data Sources. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: workday-integrations-list-data-sources
      description: Workday Integrations List data sources
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: prism-analytics-data-sources.listdatasources
      outputParameters:
      - type: object
        mapping: $.
