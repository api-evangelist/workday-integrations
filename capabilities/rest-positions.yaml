naftiko: 1.0.0-alpha2
info:
  label: Workday Integrations Workday REST API — Positions
  description: 'Workday Integrations Workday REST API — Positions. 2 operations. Lead operation: Workday Integrations List
    positions. Self-contained Naftiko capability covering one Workday Integrations business surface.'
  tags:
  - Workday Integrations
  - Positions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WORKDAY_INTEGRATIONS_API_KEY: WORKDAY_INTEGRATIONS_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-positions
    baseUri: https://wd2-impl-services1.workday.com/ccx/api/v1/{tenant}
    description: Workday Integrations Workday REST API — Positions business capability. Self-contained, no shared references.
    resources:
    - name: positions
      path: /positions
      operations:
      - name: listpositions
        method: GET
        description: Workday Integrations List positions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: positions-positionId
      path: /positions/{positionId}
      operations:
      - name: getposition
        method: GET
        description: Workday Integrations Get a position
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: positionId
          in: path
          type: string
          description: Workday ID of the position
          required: true
    authentication:
      type: bearer
      token: '{{env.WORKDAY_INTEGRATIONS_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-positions-rest
    port: 8080
    description: REST adapter for Workday Integrations Workday REST API — Positions. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/positions
      name: positions
      description: REST surface for positions.
      operations:
      - method: GET
        name: listpositions
        description: Workday Integrations List positions
        call: rest-positions.listpositions
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/positions/{positionid}
      name: positions-positionid
      description: REST surface for positions-positionId.
      operations:
      - method: GET
        name: getposition
        description: Workday Integrations Get a position
        call: rest-positions.getposition
        with:
          positionId: rest.positionId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-positions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Workday Integrations Workday REST API — Positions. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: workday-integrations-list-positions
      description: Workday Integrations List positions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-positions.listpositions
      outputParameters:
      - type: object
        mapping: $.
    - name: workday-integrations-get-position
      description: Workday Integrations Get a position
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-positions.getposition
      with:
        positionId: tools.positionId
      outputParameters:
      - type: object
        mapping: $.
