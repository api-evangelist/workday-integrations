naftiko: "1.0.0-alpha1"

info:
  label: "Workday Integrations REST API"
  description: "Modern REST API for accessing Workday business objects including workers, organizations, positions, job profiles, compensation, benefits, time off, and business processes."
  tags:
    - Workday
    - Integrations
    - Workers
    - HR
    - REST
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      WORKDAY_INTEGRATIONS_ACCESS_TOKEN: WORKDAY_INTEGRATIONS_ACCESS_TOKEN
      WORKDAY_TENANT: WORKDAY_TENANT

capability:
  consumes:
    - type: http
      namespace: workday-rest
      baseUri: https://wd2-impl-services1.workday.com/ccx/api/v1/{tenant}
      description: "Workday REST API for business objects"
      authentication:
        type: bearer
        token: "{{WORKDAY_INTEGRATIONS_ACCESS_TOKEN}}"
      resources:
        - name: workers
          path: /workers
          description: "Worker record management"
          operations:
            - name: list-workers
              method: GET
              description: "List workers"
              inputParameters:
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "Maximum results"
                - name: offset
                  in: query
                  type: integer
                  required: false
                  description: "Pagination offset"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-worker
              method: GET
              description: "Get a worker"
              inputParameters:
                - name: workerId
                  in: path
                  type: string
                  required: true
                  description: "Worker identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-worker-compensation
              method: GET
              description: "Get worker compensation"
              inputParameters:
                - name: workerId
                  in: path
                  type: string
                  required: true
                  description: "Worker identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-worker-benefits
              method: GET
              description: "Get worker benefit enrollments"
              inputParameters:
                - name: workerId
                  in: path
                  type: string
                  required: true
                  description: "Worker identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: organizations
          path: /organizations
          description: "Organization management"
          operations:
            - name: list-organizations
              method: GET
              description: "List organizations"
              inputParameters:
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "Maximum results"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-organization
              method: GET
              description: "Get an organization"
              inputParameters:
                - name: organizationId
                  in: path
                  type: string
                  required: true
                  description: "Organization identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: positions
          path: /positions
          description: "Position management"
          operations:
            - name: list-positions
              method: GET
              description: "List positions"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: job-profiles
          path: /jobProfiles
          description: "Job profile management"
          operations:
            - name: list-job-profiles
              method: GET
              description: "List job profiles"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: business-processes
          path: /businessProcesses
          description: "Business process workflow management"
          operations:
            - name: list-business-processes
              method: GET
              description: "List business processes"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: workday-rest-rest-api
      resources:
        - path: /v1/workers
          name: workers
          operations:
            - method: GET
              name: list-workers
              description: "List workers"
              call: "workday-rest.list-workers"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: workday-rest-mcp
      transport: http
      tools:
        - name: list-workers
          description: "List Workday workers (employees and contingent workers)"
          hints:
            readOnly: true
            openWorld: true
          call: "workday-rest.list-workers"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-worker
          description: "Get details of a specific worker"
          hints:
            readOnly: true
            openWorld: true
          call: "workday-rest.get-worker"
          with:
            workerId: "tools.workerId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-worker-compensation
          description: "Get compensation data for a worker"
          hints:
            readOnly: true
            openWorld: true
          call: "workday-rest.get-worker-compensation"
          with:
            workerId: "tools.workerId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-organizations
          description: "List organizational structures"
          hints:
            readOnly: true
            openWorld: true
          call: "workday-rest.list-organizations"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-positions
          description: "List position records"
          hints:
            readOnly: true
            openWorld: true
          call: "workday-rest.list-positions"
          outputParameters:
            - type: object
              mapping: "$."
