naftiko: "1.0.0-alpha1"

info:
  label: "Workday Prism Analytics API"
  description: "API for loading external data into Workday Prism Analytics for advanced reporting and analytics. Supports dataset management, data upload, and publishing operations."
  tags:
    - Workday
    - Integrations
    - Prism Analytics
    - Analytics
    - Data
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      WORKDAY_INTEGRATIONS_ACCESS_TOKEN: WORKDAY_INTEGRATIONS_ACCESS_TOKEN
      WORKDAY_TENANT: WORKDAY_TENANT

capability:
  consumes:
    - type: http
      namespace: prism-analytics
      baseUri: https://wd2-impl-services1.workday.com/ccx/api/prismAnalytics/v2/{tenant}
      description: "Workday Prism Analytics data ingestion API"
      authentication:
        type: bearer
        token: "{{WORKDAY_INTEGRATIONS_ACCESS_TOKEN}}"
      resources:
        - name: datasets
          path: /datasets
          description: "Prism Analytics dataset management"
          operations:
            - name: list-datasets
              method: GET
              description: "List datasets"
              inputParameters:
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "Maximum results"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-dataset
              method: POST
              description: "Create a dataset"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  description: "{{tools.description}}"
                  schema: "{{tools.schema}}"
            - name: get-dataset
              method: GET
              description: "Get a dataset"
              inputParameters:
                - name: datasetId
                  in: path
                  type: string
                  required: true
                  description: "Dataset identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: upload-data-to-dataset
              method: POST
              description: "Upload data to a dataset"
              inputParameters:
                - name: datasetId
                  in: path
                  type: string
                  required: true
                  description: "Dataset identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  data: "{{tools.data}}"
            - name: publish-dataset
              method: POST
              description: "Publish a dataset"
              inputParameters:
                - name: datasetId
                  in: path
                  type: string
                  required: true
                  description: "Dataset identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8101
      namespace: prism-analytics-rest-api
      resources:
        - path: /v1/datasets
          name: datasets
          operations:
            - method: GET
              name: list-datasets
              description: "List Prism datasets"
              call: "prism-analytics.list-datasets"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9101
      namespace: prism-analytics-mcp
      transport: http
      tools:
        - name: list-datasets
          description: "List Prism Analytics datasets"
          hints:
            readOnly: true
            openWorld: true
          call: "prism-analytics.list-datasets"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-dataset
          description: "Create a new Prism Analytics dataset"
          hints:
            readOnly: false
            destructive: false
          call: "prism-analytics.create-dataset"
          outputParameters:
            - type: object
              mapping: "$."
        - name: upload-data-to-dataset
          description: "Upload data records to a Prism Analytics dataset"
          hints:
            readOnly: false
            destructive: false
          call: "prism-analytics.upload-data-to-dataset"
          with:
            datasetId: "tools.datasetId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: publish-dataset
          description: "Publish a Prism Analytics dataset to make it available for reporting"
          hints:
            readOnly: false
            destructive: false
          call: "prism-analytics.publish-dataset"
          with:
            datasetId: "tools.datasetId"
          outputParameters:
            - type: object
              mapping: "$."
