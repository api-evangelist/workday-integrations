naftiko: 1.0.0-alpha2
info:
  label: Workday Integrations Workforce Data Integration
  description: Unified capability for workforce data integration combining Workday REST API for HCM data access, RaaS for
    report-based data extraction, and Prism Analytics for loading external data into Workday. Enables HR systems integrators
    to build bidirectional workforce data pipelines.
  tags:
  - Workday
  - Integrations
  - Workforce Data
  - HCM
  - Integration
  - Analytics
  created: '2026-05-03'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    WORKDAY_INTEGRATIONS_ACCESS_TOKEN: WORKDAY_INTEGRATIONS_ACCESS_TOKEN
    WORKDAY_TENANT: WORKDAY_TENANT
capability:
  consumes:
  - type: http
    namespace: workday-rest
    baseUri: https://wd2-impl-services1.workday.com/ccx/api/v1/{tenant}
    description: Workday REST API for business objects
    authentication:
      type: bearer
      token: '{{WORKDAY_INTEGRATIONS_ACCESS_TOKEN}}'
    resources:
    - name: workers
      path: /workers
      description: Worker record management
      operations:
      - name: list-workers
        method: GET
        description: List workers
        inputParameters:
        - name: limit
          in: query
          type: integer
          required: false
          description: Maximum results
        - name: offset
          in: query
          type: integer
          required: false
          description: Pagination offset
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-worker
        method: GET
        description: Get a worker
        inputParameters:
        - name: workerId
          in: path
          type: string
          required: true
          description: Worker identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-worker-compensation
        method: GET
        description: Get worker compensation
        inputParameters:
        - name: workerId
          in: path
          type: string
          required: true
          description: Worker identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-worker-benefits
        method: GET
        description: Get worker benefit enrollments
        inputParameters:
        - name: workerId
          in: path
          type: string
          required: true
          description: Worker identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: organizations
      path: /organizations
      description: Organization management
      operations:
      - name: list-organizations
        method: GET
        description: List organizations
        inputParameters:
        - name: limit
          in: query
          type: integer
          required: false
          description: Maximum results
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-organization
        method: GET
        description: Get an organization
        inputParameters:
        - name: organizationId
          in: path
          type: string
          required: true
          description: Organization identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: positions
      path: /positions
      description: Position management
      operations:
      - name: list-positions
        method: GET
        description: List positions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: job-profiles
      path: /jobProfiles
      description: Job profile management
      operations:
      - name: list-job-profiles
        method: GET
        description: List job profiles
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: business-processes
      path: /businessProcesses
      description: Business process workflow management
      operations:
      - name: list-business-processes
        method: GET
        description: List business processes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: raas
    baseUri: https://wd2-impl-services1.workday.com/ccx/service/customreport2/{tenant}
    description: Workday Report-as-a-Service API
    authentication:
      type: bearer
      token: '{{WORKDAY_INTEGRATIONS_ACCESS_TOKEN}}'
    resources:
    - name: reports
      path: /reports
      description: Report execution
      operations:
      - name: get-report
        method: GET
        description: Get report data
        inputParameters:
        - name: reportName
          in: path
          type: string
          required: true
          description: Report name
        - name: format
          in: query
          type: string
          required: false
          description: Output format (json, csv, xml)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-report-metadata
        method: GET
        description: Get report field metadata
        inputParameters:
        - name: reportName
          in: path
          type: string
          required: true
          description: Report name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: prism-analytics
    baseUri: https://wd2-impl-services1.workday.com/ccx/api/prismAnalytics/v2/{tenant}
    description: Workday Prism Analytics data ingestion API
    authentication:
      type: bearer
      token: '{{WORKDAY_INTEGRATIONS_ACCESS_TOKEN}}'
    resources:
    - name: datasets
      path: /datasets
      description: Prism Analytics dataset management
      operations:
      - name: list-datasets
        method: GET
        description: List datasets
        inputParameters:
        - name: limit
          in: query
          type: integer
          required: false
          description: Maximum results
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-dataset
        method: POST
        description: Create a dataset
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            name: '{{tools.name}}'
            description: '{{tools.description}}'
            schema: '{{tools.schema}}'
      - name: get-dataset
        method: GET
        description: Get a dataset
        inputParameters:
        - name: datasetId
          in: path
          type: string
          required: true
          description: Dataset identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: upload-data-to-dataset
        method: POST
        description: Upload data to a dataset
        inputParameters:
        - name: datasetId
          in: path
          type: string
          required: true
          description: Dataset identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            data: '{{tools.data}}'
      - name: publish-dataset
        method: POST
        description: Publish a dataset
        inputParameters:
        - name: datasetId
          in: path
          type: string
          required: true
          description: Dataset identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: workday-integrations-api
    description: Unified REST API for Workday workforce data integration.
    resources:
    - path: /v1/workers
      name: workers
      description: Worker record access
      operations:
      - method: GET
        name: list-workers
        description: List workers
        call: workday-rest.list-workers
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/workers/{workerId}
      name: worker-detail
      description: Individual worker data
      operations:
      - method: GET
        name: get-worker
        description: Get worker details
        call: workday-rest.get-worker
        with:
          workerId: rest.workerId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/organizations
      name: organizations
      description: Organizational structure
      operations:
      - method: GET
        name: list-organizations
        description: List organizations
        call: workday-rest.list-organizations
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/positions
      name: positions
      description: Position records
      operations:
      - method: GET
        name: list-positions
        description: List positions
        call: workday-rest.list-positions
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/reports/{reportName}
      name: reports
      description: Report-as-a-Service data access
      operations:
      - method: GET
        name: get-report
        description: Execute and retrieve report data
        call: raas.get-report
        with:
          reportName: rest.reportName
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/datasets
      name: datasets
      description: Prism Analytics dataset management
      operations:
      - method: GET
        name: list-datasets
        description: List Prism datasets
        call: prism-analytics.list-datasets
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-dataset
        description: Create a Prism dataset
        call: prism-analytics.create-dataset
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: workday-integrations-mcp
    transport: http
    description: MCP server for AI-assisted Workday workforce data integration.
    tools:
    - name: list-workers
      description: List Workday workers including employees and contingent workers
      hints:
        readOnly: true
        openWorld: true
      call: workday-rest.list-workers
      outputParameters:
      - type: object
        mapping: $.
    - name: get-worker
      description: Get detailed information about a specific worker
      hints:
        readOnly: true
        openWorld: true
      call: workday-rest.get-worker
      with:
        workerId: tools.workerId
      outputParameters:
      - type: object
        mapping: $.
    - name: get-worker-compensation
      description: Get compensation data for a worker
      hints:
        readOnly: true
        openWorld: true
      call: workday-rest.get-worker-compensation
      with:
        workerId: tools.workerId
      outputParameters:
      - type: object
        mapping: $.
    - name: get-worker-benefits
      description: Get benefit enrollments for a worker
      hints:
        readOnly: true
        openWorld: true
      call: workday-rest.get-worker-benefits
      with:
        workerId: tools.workerId
      outputParameters:
      - type: object
        mapping: $.
    - name: list-organizations
      description: List Workday organizational structures
      hints:
        readOnly: true
        openWorld: true
      call: workday-rest.list-organizations
      outputParameters:
      - type: object
        mapping: $.
    - name: list-positions
      description: List Workday position records
      hints:
        readOnly: true
        openWorld: true
      call: workday-rest.list-positions
      outputParameters:
      - type: object
        mapping: $.
    - name: list-job-profiles
      description: List job profiles in Workday
      hints:
        readOnly: true
        openWorld: true
      call: workday-rest.list-job-profiles
      outputParameters:
      - type: object
        mapping: $.
    - name: get-report
      description: Execute a Workday RaaS report and return data
      hints:
        readOnly: true
        openWorld: false
      call: raas.get-report
      with:
        reportName: tools.reportName
      outputParameters:
      - type: object
        mapping: $.
    - name: get-report-metadata
      description: Get field metadata for a Workday report
      hints:
        readOnly: true
        openWorld: true
      call: raas.get-report-metadata
      with:
        reportName: tools.reportName
      outputParameters:
      - type: object
        mapping: $.
    - name: list-datasets
      description: List Prism Analytics datasets
      hints:
        readOnly: true
        openWorld: true
      call: prism-analytics.list-datasets
      outputParameters:
      - type: object
        mapping: $.
    - name: create-dataset
      description: Create a new Prism Analytics dataset
      hints:
        readOnly: false
        destructive: false
      call: prism-analytics.create-dataset
      outputParameters:
      - type: object
        mapping: $.
    - name: upload-data-to-dataset
      description: Upload external data to a Prism Analytics dataset
      hints:
        readOnly: false
        destructive: false
      call: prism-analytics.upload-data-to-dataset
      with:
        datasetId: tools.datasetId
      outputParameters:
      - type: object
        mapping: $.
    - name: publish-dataset
      description: Publish a Prism Analytics dataset for reporting
      hints:
        readOnly: false
        destructive: false
      call: prism-analytics.publish-dataset
      with:
        datasetId: tools.datasetId
      outputParameters:
      - type: object
        mapping: $.
