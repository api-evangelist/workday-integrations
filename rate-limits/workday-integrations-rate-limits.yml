description: Workday Integrations operate under tenant-level concurrency, transaction, and runtime limits that Workday does not publish on its public marketing site. Numeric thresholds for Studio, Cloud Connect, and EIB live in Workday Community / Customer Center documentation behind authentication.
sources:
  - https://www.workday.com/en-us/enterprise-resource-planning.html
notes: No public per-second or per-minute limits documented. Scaffold tier numbers have been removed.
responseCodes: {}
limits:
  - name: Tenant Integration Concurrency
    scope: tenant
    metric: concurrent_integrations
    limit: governed by Workday tenant entitlement; not publicly documented
    notes: Workday caps the number of concurrent integration runs per tenant; the exact value is published to authenticated Workday customers.
  - name: Tenant Web Service Throughput
    scope: tenant
    metric: varies
    limit: governed by the parent Workday tenant; not publicly documented
    notes: REST and SOAP web service calls share the tenant's API capacity envelope.
policies:
  - name: Tenant Inheritance
    description: Integrations inherit the parent Workday tenant's API quotas; throttling, retries, and integration backoff follow tenant policies.
  - name: Customer Center Documentation
    description: Numeric thresholds for integration concurrency and web service throughput are published to authenticated Workday customers in Workday Community.
