specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Workday Integrations
providerId: workday-integrations
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Integration
  - iPaaS
  - FinOps
  - FOCUS
description: FOCUS-aligned FinOps stub for the Workday Integrations capability. Integration entitlement is bundled into the Workday tenant subscription; per-integration-run pricing and a public usage API are not exposed, so meters describe contractual entitlement rather than runtime billing.
sources:
  - https://www.workday.com/en-us/enterprise-resource-planning.html
notes: Duplicates the workday-integration finops surface under the alternate slug. Generic api_request / data_egress / compute_seconds meters from the scaffold have been removed.
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Workday, Inc.
serviceCategory: Integration / iPaaS
billingModel:
  pricingCategory: Subscription
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
    - Purchase
focusColumns:
  ServiceName: Workday Integrations
  ServiceCategory: Integration / iPaaS
  ProviderName: Workday
  PublisherName: Workday, Inc.
  InvoiceIssuerName: Workday, Inc.
  BillingCurrency: USD
meters:
  - name: integrations_entitlement
    description: Annual Workday Integrations entitlement attached to the tenant subscription; covers Studio runtime and bundled Cloud Connect packs.
    unit: month
    aggregation: max
    dimensions:
      - tenant
  - name: active_integrations
    description: Count of customer-built and Cloud Connect integrations active in the tenant; used for governance and renewal sizing rather than per-run billing.
    unit: integration
    aggregation: max
    dimensions:
      - tenant
      - integration_type
principles:
  - name: Visibility
    description: Maintain an integration inventory (owner, source / target, cadence) and reconcile it against tenant integration event reports; invoice line items don't break out integration runs, so visibility comes from the catalog plus utilization telemetry.
  - name: Allocation
    description: Allocate integration spend back to the systems-of-record on each side of the integration; require a business case linking each new integration to a downstream consumer.
  - name: Optimization
    description: Retire dead integrations at renewal, prefer EIB over custom Studio when data shape allows, schedule batch runs in low-load windows, and consolidate point-to-point flows into reusable Studio templates.
  - name: Accountability
    description: An Integration Center of Excellence lead approves new integrations, runs quarterly inventory reviews, and represents the integration backlog at Workday renewal conversations.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
